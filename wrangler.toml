# ZinkPress intake portal: one Cloudflare Worker that serves the intake form
# (built into apps/web/dist) and the API under /api/*.
# Cloudflare's dashboard builds and deploys this on every push to main (see README).

name = "zp-intake-portal"
main = "apps/worker/src/index.ts"
compatibility_date = "2026-11-01"
compatibility_flags = ["nodejs_compat"]

# The intake form. `npm run build` puts it here before each deploy.
# /api/* goes to the Worker code; every other address serves the form.
[assets]
directory = "apps/web/dist"
not_found_handling = "single-page-application"
run_worker_first = ["/api/*"]

# Housekeeping every hour: wipe client API keys after their purge date,
# expire old links, retry Jira/receipt emails that failed.
# The 8:17 AM Eastern run also posts the morning workload check to #sprint-ops.
[triggers]
crons = ["17 * * * *"]

[[d1_databases]]
binding = "DB"
database_name = "zp-intake"
database_id = "dbe569b8-56f6-48db-9e8b-c0e50551e4c3"
migrations_dir = "apps/worker/migrations"

[[r2_buckets]]
binding = "ASSETS_BUCKET"
bucket_name = "zp-intake-assets"

[vars]
AGENCY_NAME = "ZinkPress"
AGENCY_EMAIL = "ZinkPress@proton.me"            # the email clients invite as admin (registrar, Cloudflare)
PORTAL_URL = ""                                  # leave empty: links use this Worker's own address. Set it once you add a custom domain.
BUSINESS_TIMEZONE = "America/New_York"           # Eastern time; follows daylight saving on its own
# Days the sprint clock skips, on top of every Saturday and Sunday: US federal holidays
# on their observed weekday (a Saturday holiday moves to Friday, a Sunday one to Monday),
# plus the Friday after Thanksgiving so that week is a 4-day weekend. 2026 and 2027.
# Delete a date to work it; add your own days off. Add 2028 before the end of 2027.
HOLIDAYS = "2026-01-01,2026-01-19,2026-02-16,2026-05-25,2026-06-19,2026-07-03,2026-09-07,2026-10-12,2026-11-11,2026-11-26,2026-11-27,2026-12-25,2027-01-01,2027-01-18,2027-02-15,2027-05-31,2027-06-18,2027-07-05,2027-09-06,2027-10-11,2027-11-11,2027-11-25,2027-11-26,2027-12-24,2027-12-31"
TOKEN_TTL_DAYS = "14"                            # how long a client's intake link works
SECRETS_PURGE_DAYS = "7"                         # wipe client API keys this many days after launch
RECEIPT_FROM_EMAIL = ""                          # a Resend-verified sender. Empty = no emails at all (Resend rejects the Proton AGENCY_EMAIL)
STAGING_URL_TEMPLATE = ""                        # e.g. "https://{project}.pages.dev" (optional)
CLOUDFLARE_HELP_URL = "https://developers.cloudflare.com/fundamentals/manage-members/manage/"
JIRA_DOMAIN = ""                                 # e.g. "zinkpress.atlassian.net" (leave empty to skip Jira)
JIRA_PROJECT_KEY = ""                            # e.g. "ZP"
JIRA_EPIC_TYPE = "Epic"
JIRA_TASK_TYPE = "Task"

# Secrets: add these in the Cloudflare dashboard (Settings > Variables and Secrets,
# type "Secret"), never in this file. This repo is public.
#   SECRETS_ENCRYPTION_KEY  any random password, 32+ characters. Never change or lose it.
#   ADMIN_API_TOKEN         any random password, 32+ characters
#   STRIPE_WEBHOOK_SECRET   whsec_... from your Stripe webhook
#   RESEND_API_KEY          re_... (optional, needs your own domain)
#   JIRA_EMAIL              your Atlassian login email (optional)
#   JIRA_API_TOKEN          from id.atlassian.com (optional)
#   GITHUB_TOKEN            fine-grained token with no permissions (optional, raises GitHub's rate limit)
#   ZP_LANDING_ONBOARD_URL     https://zp-landing.peaceiam4now.workers.dev/api/onboard (optional; empty = skip the hand-off)
#   ZP_LANDING_WEBHOOK_SECRET  the same value as WEBHOOK_SECRET on the zp-landing Worker
# After a submit, the intake portal posts the client to zp-landing (Drive, Airtable, HubSpot,
# welcome email, Slack). The hourly cron retries until zp-landing answers 2xx.
#
# Slack alerts (all optional; each one is skipped until its URL is set).
# Each value is a Slack Incoming Webhook URL (https://hooks.slack.com/services/...).
#   SLACK_WEBHOOK_REVENUE     #pipeline-revenue   invoice paid
#   SLACK_WEBHOOK_SPRINT_OPS  #sprint-ops         sprint clock started, Jira epic ready, 8 AM workload check
#   SLACK_WEBHOOK_APPROVALS   #staging-approvals  reserved for staging approvals (nothing posts here yet)
#   SLACK_WEBHOOK_ERRORS      #worker-errors      any 500 error, and kickoff follow-ups that fail
